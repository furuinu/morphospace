name: Deploy MORPHOSPACE to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'about-i18n.js'
      - 'manifest.webmanifest'
      - 'scripts/generate_home_icons.py'
      - 'surface-reaction.js'
      - 'tests/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: morphospace-pages
  cancel-in-progress: false

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify WebGL and observation mode
        run: node tests/webgl-observation-smoke.cjs
  deploy:
    needs: browser-smoke
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Build DNA home screen icons
        run: |
          python3 -m pip install --quiet Pillow==11.3.0
          python3 scripts/generate_home_icons.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          icons = {
              'apple-touch-icon.png': 180,
              'icon-192.png': 192,
              'icon-512.png': 512,
              'icon-maskable-512.png': 512,
          }
          for name, size in icons.items():
              file = Path('icons') / name
              assert file.is_file() and file.stat().st_size > 1000, name
              with Image.open(file) as icon:
                  assert icon.size == (size, size), name
                  assert icon.mode == 'RGB', name
          assert Path('icons/favicon.svg').read_text().startswith('<svg')
          manifest = json.loads(Path('manifest.webmanifest').read_text())
          assert manifest['start_url'] == './'
          assert all(Path(entry['src']).is_file() for entry in manifest['icons'])
          print('PASS: all DNA home screen icons and manifest verified')
          PY
      - name: Validate site
        run: |
          test -s index.html
          test -s manifest.webmanifest
          test -s icons/apple-touch-icon.png
          grep -q 'rel="apple-touch-icon"' index.html
          grep -q 'MORPHOSPACE' index.html
          # XServer still runs its historical check for this inert marker.
          # The actual experimental preset generator must NOT be executable.
          grep -q 'Inert XServer legacy deployment marker: data-bundled="voice-styles.js"' index.html
          if grep -q '<script data-bundled="voice-styles.js"' index.html; then
            echo "Experimental voice presets must not execute in production" >&2
            exit 1
          fi
          grep -q 'data-bundled="surface-reaction.js"' index.html
          test -s about-i18n.js
          node --check about-i18n.js
          # Only an audited, local, same-origin translation file is permitted here.
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class ScriptSources(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.sources = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      src = dict(attrs).get('src')
                      if src is not None:
                          self.sources.append(src)
          parser = ScriptSources()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          if parser.sources != ['about-i18n.js']:
              raise SystemExit(f'Unexpected script dependencies: {parser.sources!r}')
          PY
          echo "Deploying $(grep -o 'MORPHOSPACE v[0-9.]*' index.html | head -1)"
      - name: Check specimen restoration and colour regressions
        run: node --test tests/*.test.cjs
      - name: Stamp unique visible version for every deployment
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          match = re.search(r'<span class="version-label">v(\d+)\.(\d+)\.(\d+)</span>', html)
          if not match:
              raise SystemExit('Visible MORPHOSPACE version label missing')
          base = '.'.join(match.groups())
          version = f'v{base}.{os.environ["BUILD_NUMBER"]}.{os.environ["BUILD_ATTEMPT"]}'
          html, count = re.subn(r'v' + re.escape(base) + r'(?![\d.])', version, html)
          if count < 4:
              raise SystemExit(f'Expected visible version references, found {count}')
          path.write_text(html, encoding='utf-8')
          print(f'Deploying MORPHOSPACE {version} ({count} labels)')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

