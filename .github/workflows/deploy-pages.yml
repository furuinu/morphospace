name: Deploy MORPHOSPACE to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: morphospace-pages
  cancel-in-progress: false

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify WebGL and observation mode
        run: node tests/webgl-observation-smoke.cjs
  deploy:
    needs: browser-smoke
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Validate site
        run: |
          test -s index.html
          grep -q 'MORPHOSPACE' index.html
          echo "Deploying $(grep -o 'MORPHOSPACE v[0-9.]*' index.html | head -1)"
      - name: Check specimen restoration and colour regressions
        run: node --test tests/*.test.cjs
      - name: Stamp unique visible version for every deployment
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          match = re.search(r'<span class="version-label">v(\d+)\.(\d+)\.(\d+)</span>', html)
          if not match:
              raise SystemExit('Visible MORPHOSPACE version label missing')
          base = '.'.join(match.groups())
          version = f'v{base}.{os.environ["BUILD_NUMBER"]}.{os.environ["BUILD_ATTEMPT"]}'
          html, count = re.subn(r'v' + re.escape(base) + r'(?![\d.])', version, html)
          if count < 4:
              raise SystemExit(f'Expected visible version references, found {count}')
          path.write_text(html, encoding='utf-8')
          print(f'Deploying MORPHOSPACE {version} ({count} labels)')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

